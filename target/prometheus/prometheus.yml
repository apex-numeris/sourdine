# Sourdine — Prometheus de la CIBLE ÉPHÉMÈRE (jetable, isolée).
# Recréé, jamais copié depuis la production. Intervalles courts pour un banc rapide.
global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['sourdine-alertmanager:9093']

scrape_configs:
  - job_name: 'sourdine-exporter'
    honor_labels: true          # laisse l'exporter porter job/instance synthétiques
    metrics_path: /metrics
    static_configs:
      - targets: ['sourdine-exporter:8000']

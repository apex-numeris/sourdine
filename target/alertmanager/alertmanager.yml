# Sourdine — Alertmanager de la CIBLE ÉPHÉMÈRE (jetable, isolée).
# Règles d'inhibition représentatives, RECRÉÉES (jamais copiées de la prod) :
#   InstanceDown   masque toutes les alertes de la même instance
#   FirewallDown   masque {HighAttackRate, CriticalAttacksDetected, JailbreakSurge} (même job)
#   PostgreSQLDown masque PostgreSQL.* (même job)
# Toute notification part vers le sink webhook du banc (jamais Slack/PagerDuty réels).
global:
  resolve_timeout: 2m

route:
  group_by: ['alertname', 'service', 'severity']
  group_wait: 3s
  group_interval: 5s
  repeat_interval: 1h
  receiver: sourdine-sink
  routes:
    # Route "trou noir" : toute alerte portant le label route_target="blackhole" est
    # envoyée au récepteur `blackhole` (sans destination) -> sa notification est AVALÉE.
    # Reproduit la manœuvre d'un attaquant avec accès au routage (T1562.006 Indicator
    # Blocking) qui reroute une classe d'alertes hors du récepteur légitime. Inerte pour
    # tout autre scénario : seules les alertes portant ce label la matchent.
    - matchers: ['route_target="blackhole"']
      receiver: blackhole
      continue: false

receivers:
  - name: sourdine-sink
    webhook_configs:
      - url: http://sourdine-sink:9099/
        send_resolved: false
  # Récepteur « trou noir » : aucune destination de notification. Une alerte routée ici
  # est active dans Alertmanager mais n'est jamais notifiée (le fil est débranché avant
  # le récepteur) — ni silence, ni inhibition. Support du vecteur route_blackhole.
  - name: blackhole

inhibit_rules:
  - source_matchers: ['alertname="InstanceDown"']
    target_matchers: ['alertname=~".+"']
    equal: ['instance']
  - source_matchers: ['alertname="FirewallDown"']
    target_matchers: ['alertname=~"HighAttackRate|CriticalAttacksDetected|JailbreakSurge"']
    equal: ['job']
  - source_matchers: ['alertname="PostgreSQLDown"']
    target_matchers: ['alertname=~"PostgreSQL.*"']
    equal: ['job']

# Sourdine : campagne sur la vraie cible éphémère (Prometheus, Alertmanager, exporter
# et sink en conteneurs), chaque lundi et à chaque pull request qui touche la cible ou
# le backend docker, une montée de version d'image par exemple. Ce backend dépend du temps
# réel, donc `make test-docker` ne compare pas à l'identique : il vérifie les
# invariants (cohérence à 100 %, masqueurs déterministes toujours masqués et
# rattrapés, contrôles de cohérence jamais signalés) et des garde-fous avec
# tolérance autour de l'échantillon docker gelé de la version courante.
# Le rapport complet sort en artefact ; les contrôles en échec s'affichent dans le
# résumé du run et en annotations, lisibles sans ouvrir les logs.
name: docker-weekly

on:
  schedule:
    - cron: "0 6 * * 1"   # lundi 06:00 UTC, 08:00 à Paris (GitHub peut le lancer avec plusieurs heures de retard)
  pull_request:
    paths:
      - "target/**"
      - "engine/target_docker.py"
      - "tests/test_docker_regression.py"
      - ".github/workflows/docker-weekly.yml"
  workflow_dispatch:

permissions:
  contents: read

# Une pull request mise à jour annule sa campagne en cours ; celle du lundi n'est jamais annulée.
concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker:
    name: campagne docker, cible éphémère réelle
    # runner épinglé : le libellé ubuntu-latest bascule sur Ubuntu 26 à partir du 19/10/2026
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SOURDINE_DOCKER_REPORT: reports/docker-ci.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Versions de docker et de compose
        run: |
          docker version
          docker compose version
      - name: make test-docker
        run: make test-docker
      - name: Résumé des contrôles
        if: always()
        run: python3 scripts/ci_summary.py "$SOURDINE_DOCKER_REPORT"
      - name: Rapport de campagne en artefact
        if: always()
        continue-on-error: true   # un dépôt d'artefact refusé ne doit pas fausser le verdict
        uses: actions/upload-artifact@v7
        with:
          name: sourdine-docker-${{ github.run_number }}
          path: ${{ env.SOURDINE_DOCKER_REPORT }}
          if-no-files-found: warn
      - name: Purge de la cible (filet de sécurité)
        if: always()
        run: scripts/target_down.sh || true
